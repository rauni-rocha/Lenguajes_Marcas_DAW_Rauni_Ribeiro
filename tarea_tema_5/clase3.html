<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla 3 - Unir celdas</title>
    <link rel="stylesheet" href="estilo_tabla1.css">

</head>
<body>

<p><a href="index.html">Tema 5</a></p>
<table><caption>Un ejemplo de colspan y rowspan</caption>
<thead><tr><th>Hora</th><th>Lunes</th><th>Martes</th><th>Miércoles</th></tr></thead>
<tbody>
<tr><td>15:00</td><td rowspan="2">HTML y CSS</td><td>Java</td><td>Bases de datos</td></tr>
<tr><td>16:00</td><td>Java</td><td>Bases de datos</td></tr>
<tr><td>17:00</td><td colspan="3">Descanso para todos</td></tr>
<tr><td>18:00</td><td>Linux</td><td>HTML</td><td>Java</td></tr>
</tbody></table>
<p>Con rowspan una celda ocupa dos filas. Con colspan ocupa mas columnas.</p>

</body>
</html>
